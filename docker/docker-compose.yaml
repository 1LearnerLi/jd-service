# ==============================================================================
# 电商智能客服系统 — Docker Compose 全容器化部署
#
# 使用方式：
#   1. 在 docker/ 下创建 .env 文件，填入 OPENAI_API_KEY=sk-xxx
#   2. docker compose up -d --build
#   3. 访问 http://localhost
#
# 服务（全部在同一 ecs-network 内通信）：
#   mysql   — MySQL 8.0，端口 3307
#   neo4j   — Neo4j 5.26，端口 7474 / 7687
#   backend — FastAPI + uv，内部 8000（不暴露宿主机端口）
#   nginx   — 前端静态文件 + /api/* 反向代理 → backend:8000，端口 80
# ==============================================================================

services:
  # ── MySQL 8.0 ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ecs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123321
      MYSQL_DATABASE: ecs
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/ecs.sql:/docker-entrypoint-initdb.d/01-ecs.sql
      - ./mysql/init-platform.sql:/docker-entrypoint-initdb.d/02-platform.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123321"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ecs-network

  # ── Neo4j 5.26 知识图谱 ────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    container_name: ecs-neo4j
    restart: unless-stopped
    entrypoint: ["/init-entrypoint.sh"]
    environment:
      NEO4J_AUTH: neo4j/neo4j123456
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - ./neo4j/plugins:/plugins
      - ./neo4j/neo4j.dump:/init-data/neo4j.dump
      - ./neo4j/docker-entrypoint-init.sh:/init-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - ecs-network

  # ── FastAPI 后端 ──────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: ecs-backend
    restart: unless-stopped
    environment:
      # LLM 配置（敏感值从 docker/.env 读取）
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      # 平台数据库（容器内通过容器名 mysql 访问，端口 3306）
      - PLATFORM_DATABASE_URL=mysql+asyncmy://root:123321@mysql:3306/ecs_platform?charset=utf8mb4
      # 电商业务数据库
      - ECO_DATABASE_URL=mysql+asyncmy://root:123321@mysql:3306/ecs?charset=utf8mb4
      # Neo4j 知识图谱（容器内通过容器名 neo4j 访问）
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123456
      # 嵌入模型使用 config.py 中的默认值（无需在此覆盖）
      # 应用运行参数
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - ecs-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── nginx 前端 + 反向代理 ─────────────────────────────
  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    container_name: ecs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecs-network

# ── 数据卷 ──────────────────────────────────────────────
volumes:
  mysql-data:
  neo4j-data:

# ── 内部网络 ────────────────────────────────────────────
networks:
  ecs-network:
    driver: bridge
