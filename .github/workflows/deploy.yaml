# 自动部署工作流
#
# 当 main 分支有代码推送时（PR 合并或被直接推送），
# SSH 到阿里云服务器执行自动部署：
#   git pull → 注入密钥 → docker compose up -d --build
#
# 复用已有的 scripts/deploy.sh 脚本，通过 BRANCH=main 指定部署分支。
#
# 需要在 GitHub Secrets 中配置以下密钥：
#   SSH_HOST              - 阿里云服务器 IP 或域名
#   SSH_USER              - SSH 登录用户名（默认 root）
#   SSH_PORT              - SSH 端口（默认 22）
#   GH_SSH_PRIVATE_KEY    - SSH 私钥，用于 Actions 免密登录阿里云服务器
#
#   以下密钥会注入到服务器 docker/.env 中（可选但推荐配置）：
#   OPENAI_API_KEY     - LLM API Key
#   OPENAI_BASE_URL    - LLM 接口地址
#   LLM_MODEL          - LLM 模型名称
#   DASHSCOPE_API_KEY  - DashScope API Key
#   LOG_LEVEL          - 日志级别

name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 上传部署脚本到服务器
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.GH_SSH_PRIVATE_KEY }}
          source: scripts/deploy.sh,scripts/deploy.conf
          target: /tmp/
          overwrite: true

      - name: 执行远程自动部署
        uses: appleboy/ssh-action@v1.2.2
        env:
          BRANCH: main
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.GH_SSH_PRIVATE_KEY }}
          request_pty: true
          command_timeout: 60m
          envs: BRANCH,OPENAI_API_KEY,OPENAI_BASE_URL,LLM_MODEL,DASHSCOPE_API_KEY,LOG_LEVEL
          script: |
            set -euo pipefail
            bash /tmp/scripts/deploy.sh
