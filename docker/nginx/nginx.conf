# ── nginx 配置：电商智能客服系统 ──────────────────────
#
# 职责：
#   /           → 前端 SPA 静态文件（Vue Router history 模式）
#   /api/*      → 反向代理到后端 FastAPI:8000
#   /health     → 反向代理到后端健康检查端点
#
# 容器内 DNS：backend → ecs-backend 容器 IP

server {
    listen 80;
    server_name _;

    # ── 静态文件根目录 ────────────────────────────────
    root /var/www/jd-cs;
    index index.html;

    # ── gzip 压缩 ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/html;
    gzip_min_length 256;

    # ── 前端 SPA 路由（history 模式 fallback）─────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 API 反向代理 ─────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应需要关闭缓冲
        proxy_buffering off;

        # 超时配置（LLM 对话可能响应较慢）
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── 健康检查 ──────────────────────────────────────
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ── 安全头 ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
