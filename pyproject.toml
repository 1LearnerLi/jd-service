[project]
name = "jd-service"
version = "0.1.0"
description = "电商智能客服系统"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncmy>=0.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
    "jieba>=0.42.1",
    "dashscope>=1.26.2",
    "neo4j>=6.2.0",
    "neo4j-graphrag>=1.18.0",
    "langchain-neo4j>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests (requires real LLM API key)",
]
